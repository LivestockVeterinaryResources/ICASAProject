project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!presentations/"
  resources:
    - dataflow.html

website:
  title: "Home"
  open-graph: true # https://quarto.org/docs/websites/website-tools.html#open-graph
  page-footer: "Questions about this project? email: mapley@k-state.edu"
  navbar:
    title: 'ICASA Project'
    tools: 
      - icon: github
        href: https://github.com/damrine/ICASA-anonymous
    right:
      - text: Home
        href: index.qmd
      - text: About
        href: About.qmd
      - text: Methods
        href: Methods.qmd
      - text: Data Flow
        href: dataflow.html
        
      
format:
  html:
    #backgroundcolor: '#7570b3'
    #fontcolor: '#542788'
    #mainfont: serif
    # Slate + copper, matching the three Shiny apps. Base is flatly -- the same
    # Bootswatch base icasa_theme.R builds on -- with the palette applied in
    # styles.scss. `linkcolor: purple` was removed: it emitted a hard link rule
    # that overrode the theme.
    theme: [flatly, styles.scss]

